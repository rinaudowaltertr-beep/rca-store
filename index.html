<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RCA Store</title>
  <style>
    :root {
      --fucsia: #ff007f;
      --verde: #00e676;
      --rojo: #ff1744;
      --azul: #2979ff;
      --amarillo: #ffea00;
      --negro: #0b0b0f;
      --blanco: #ffffff;
      --gris-card: #16161e;
      --zoom-scale: 1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--negro);
      color: var(--blanco);
      min-height: 100vh;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    #app-wrapper {
      transform: scale(var(--zoom-scale));
      transform-origin: top center;
      width: calc(100% / var(--zoom-scale));
      transition: transform 0.15s ease;
    }

    /* ENCABEZADO SUPERIOR */
    header {
      background: linear-gradient(90deg, #111118 0%, #1c1024 100%);
      border-bottom: 2px solid var(--fucsia);
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .store-title {
      font-size: 2.3rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--fucsia), var(--amarillo), var(--verde));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    /* CONTROL - ZOOM + */
    .zoom-box {
      display: inline-flex;
      align-items: center;
      background: #1f1f2b;
      border: 1px solid var(--azul);
      border-radius: 8px;
      overflow: hidden;
    }

    .zoom-box button {
      background: transparent;
      border: none;
      color: var(--amarillo);
      font-size: 1.2rem;
      font-weight: bold;
      padding: 6px 12px;
      cursor: pointer;
    }

    .zoom-box button:active {
      background: var(--azul);
      color: var(--blanco);
    }

    .zoom-box span {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--blanco);
      padding: 0 6px;
      user-select: none;
    }

    /* ICONOS DE COMPARTIR */
    .share-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .share-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--blanco);
      text-decoration: none;
      transition: transform 0.15s;
    }

    .share-icon:active {
      transform: scale(0.9);
    }

    .sh-fb { background: #1877f2; }
    .sh-ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .sh-tt { background: #000000; border: 1px solid var(--fucsia); }
    .sh-mail { background: var(--rojo); }
    .sh-wa { background: #25d366; }
    .sh-yui {
      background: var(--fucsia);
      font-weight: 900;
      font-size: 1rem;
      border: 1px solid var(--amarillo);
    }

    .admin-toggle {
      background: transparent;
      border: 1px solid #333;
      color: #888;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .admin-toggle.unlocked {
      border-color: var(--verde);
      color: var(--verde);
    }

    /* BARRA DE BUSQUEDA */
    .search-section {
      padding: 14px 16px 6px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .search-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input-wrap svg {
      position: absolute;
      left: 14px;
      color: var(--fucsia);
    }

    #search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border-radius: 10px;
      border: 2px solid var(--azul);
      background: #14141c;
      color: var(--blanco);
      font-size: 1rem;
      outline: none;
    }

    #search-input:focus {
      border-color: var(--fucsia);
    }

    /* BARRA DE INFO DE PAGINA Y EXPORTAR */
    .status-bar {
      max-width: 1100px;
      margin: 8px auto 0;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #bbb;
    }

    .btn-export {
      background: var(--verde);
      color: var(--negro);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      display: none;
    }

    /* CUADRICULA DE APLICACIONES */
    .apps-grid {
      max-width: 1100px;
      margin: 14px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }

    .app-card {
      background: var(--gris-card);
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #262636;
      display: flex;
      flex-direction: column;
      position: relative;
      aspect-ratio: 1 / 1.18;
    }

    /* TARJETA CON FOTO COMPLETA */
    .app-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #1e1e2a;
    }

    .app-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.92) 15%, rgba(0, 0, 0, 0.1) 60%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 10px;
    }

    .app-name {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--blanco);
      margin-bottom: 6px;
      text-shadow: 0 1px 4px #000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-download {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--verde);
      color: var(--negro);
      font-weight: 900;
      font-size: 0.85rem;
      padding: 7px 6px;
      border-radius: 8px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    .btn-download:active {
      background: var(--amarillo);
    }

    .btn-delete-app {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--rojo);
      color: var(--blanco);
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      z-index: 5;
      display: none;
    }

    /* CUADRADO VACIO CON SIGNO + (SOLO DUENO) */
    .add-slot {
      border: 2px dashed var(--fucsia);
      background: #13131b;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .add-slot:active {
      background: #221324;
    }

    .plus-sign {
      font-size: 3.5rem;
      font-weight: 300;
      color: var(--fucsia);
      line-height: 1;
    }

    .add-label {
      font-size: 0.75rem;
      color: #aaa;
      margin-top: 4px;
    }

    /* BOTON FLOTANTE ABAJO A LA DERECHA PARA SEGUIR AGREGANDO CONTINUAMENTE */
    .next-page-fab {
      position: fixed;
      bottom: 18px;
      right: 18px;
      background: linear-gradient(135deg, var(--fucsia), var(--azul));
      color: var(--blanco);
      border: 2px solid var(--amarillo);
      border-radius: 50px;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(255, 0, 127, 0.5);
      cursor: pointer;
      z-index: 200;
    }

    .prev-page-fab {
      position: fixed;
      bottom: 18px;
      left: 18px;
      background: #1d1d29;
      color: var(--blanco);
      border: 1px solid var(--azul);
      border-radius: 50px;
      padding: 12px 16px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      z-index: 200;
      display: none;
    }

    /* VENTANA MODAL PARA PEGAR ENLACE Y FOTO */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 500;
    }

    .modal-box {
      background: #171722;
      border: 2px solid var(--fucsia);
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-box h3 {
      color: var(--amarillo);
      font-size: 1.2rem;
    }

    .modal-box label {
      font-size: 0.85rem;
      color: #ccc;
      display: block;
      margin-bottom: 4px;
    }

    .modal-box input[type="text"],
    .modal-box input[type="url"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--azul);
      background: #0e0e14;
      color: var(--blanco);
      font-size: 0.95rem;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .modal-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-save { background: var(--verde); color: var(--negro); }
    .btn-cancel { background: var(--rojo); color: var(--blanco); }
  </style>
</head>
<body>

<div id="app-wrapper">
  <!-- ENCABEZADO -->
  <header>
    <div class="brand-row">
      <div class="store-title">RCA Store</div>

      <!-- CONTROL - ZOOM + -->
      <div class="zoom-box" title="Ajustar tamaño">
        <button type="button" onclick="cambiarZoom(-0.1)">−</button>
        <span>zoom</span>
