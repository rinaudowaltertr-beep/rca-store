<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RCA Store</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="real-company-logo-rca.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding-bottom: 40px; }
    header { position: sticky; top: 0; background: #0f172a; padding: 16px; border-bottom: 1px solid #1e293b; z-index: 10; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
    .brand img { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; }
    #btnInstalar { background: #38bdf8; color: #0f172a; border: none; padding: 8px 14px; border-radius: 20px; font-weight: 700; font-size: 13px; display: none; }
    input[type="text"] { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 15px; outline: none; }
    input[type="text"]::placeholder { color: #94a3b8; }
    main { padding: 16px; max-width: 600px; margin: 0 auto; }
    h2 { font-size: 16px; color: #94a3b8; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
    .app-card { display: flex; align-items: center; background: #1e293b; padding: 14px; border-radius: 16px; margin-bottom: 12px; gap: 14px; }
    .app-icon { width: 56px; height: 56px; border-radius: 14px; object-fit: cover; background: #334155; flex-shrink: 0; }
    .app-info { flex: 1; min-width: 0; }
    .app-title { font-weight: 700; font-size: 16px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-desc { font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
    .app-meta { font-size: 11px; color: #38bdf8; font-weight: 600; }
    .btn-get { background: #2563eb; color: white; text-decoration: none; padding: 9px 16px; border-radius: 20px; font-weight: 600; font-size: 13px; flex-shrink: 0; }
  </style>
</head>
<body>
  <header>
    <div class="top-bar">
      <div class="brand">
        <img src="real-company-logo-rca.png" alt="Logo">
        <span>RCA Store</span>
      </div>
      <button id="btnInstalar">Instalar App</button>
    </div>
    <input type="text" id="buscador" placeholder="Buscar aplicaciones..." onkeyup="filtrarApps()">
  </header>
  <main>
    <h2>Destacadas</h2>
    <div id="listaApps">
      <div class="app-card">
        <img src="real-company-logo-rca.png" class="app-icon" alt="App">
        <div class="app-info">
          <div class="app-title">Mi Primera App</div>
          <div class="app-desc">Aplicación oficial de Real Company Argentina</div>
          <div class="app-meta">★ 5.0 • Gratis</div>
        </div>
        <a href="https://google.com" target="_blank" class="btn-get">Abrir</a>
      </div>
    </div>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
    let eventoInstalacion;
    const btnInstalar = document.getElementById('btnInstalar');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      eventoInstalacion = e;
      btnInstalar.style.display = 'block';
    });
    btnInstalar.addEventListener('click', () => {
      if (eventoInstalacion) eventoInstalacion.prompt();
    });
    function filtrarApps() {
      const texto = document.getElementById('buscador').value.toLowerCase();
      const tarjetas = document.querySelectorAll('.app-card');
      tarjetas.forEach(card => {
        const titulo = card.querySelector('.app-title').innerText.toLowerCase();
        card.style.display = titulo.includes(texto) ? 'flex' : 'none';
      });
    }
  </script>
</body>
</html>
